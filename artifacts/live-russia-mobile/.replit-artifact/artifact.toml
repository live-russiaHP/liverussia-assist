kind = "mobile"
previewPath = "/mobile/"
title = "Live Russia Assistant Mobile"
description = "A native Android companion app for Live Russia assistants with onboarding, persistent account IDs, searchable commands and prices, premium access, and administrator account management."
version = "1.0.0"
id = "artifacts/live-russia-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 24371

[services.development]
run = "pnpm --filter @workspace/live-russia-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/live-russia-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/live-russia-mobile", "run", "serve" ]

[services.env]
PORT = "24371"
BASE_PATH = "/mobile/"
