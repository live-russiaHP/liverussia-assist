openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Live Russia Assistant Hub knowledge base API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: knowledge
  - name: dashboard
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /knowledge:
    get:
      operationId: listKnowledge
      tags: [knowledge]
      summary: List knowledge rules
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
        - name: category
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Knowledge rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KnowledgeItem" }
    post:
      operationId: createKnowledge
      tags: [knowledge]
      summary: Create a knowledge rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeCreate" }
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeItem" }
        "400": { description: Invalid rule }
  /knowledge/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getKnowledge
      tags: [knowledge]
      summary: Get a knowledge rule
      responses:
        "200":
          description: Knowledge rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeItem" }
        "404": { description: Rule not found }
    patch:
      operationId: updateKnowledge
      tags: [knowledge]
      summary: Update a knowledge rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KnowledgeUpdate" }
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeItem" }
        "404": { description: Rule not found }
    delete:
      operationId: deleteKnowledge
      tags: [knowledge]
      summary: Delete a knowledge rule
      responses:
        "204": { description: Rule deleted }
        "404": { description: Rule not found }
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get knowledge base summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardStats" }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    KnowledgeItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        answer: { type: string }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        isPremium: { type: boolean }
        updatedAt: { type: string }
      required: [id, title, answer, category, tags, isPremium, updatedAt]
    KnowledgeCreate:
      type: object
      properties:
        title: { type: string, minLength: 2 }
        answer: { type: string, minLength: 2 }
        category: { type: string, minLength: 1 }
        tags:
          type: array
          items: { type: string }
        isPremium: { type: boolean }
      required: [title, answer, category]
    KnowledgeUpdate:
      type: object
      properties:
        title: { type: string, minLength: 2 }
        answer: { type: string, minLength: 2 }
        category: { type: string, minLength: 1 }
        tags:
          type: array
          items: { type: string }
        isPremium: { type: boolean }
    DashboardStats:
      type: object
      properties:
        totalKnowledge: { type: integer }
        commandCount: { type: integer }
        priceCount: { type: integer }
        premiumCount: { type: integer }
      required: [totalKnowledge, commandCount, priceCount, premiumCount]
